<body>
<div class="app">
  <div class="screen-nav"><button id="navCreate" class="btn active" type="button" onclick="showScreen('create')">土層記載を作成</button><button id="navSaved" class="btn" type="button" onclick="showScreen('saved')">保存データ</button></div>
  <div id="createScreen" class="app-screen active">
  <div id="mobileCurrent" class="mobile-current">現在の入力</div>

  <div class="card">
    <div class="project-title">現場名</div>
    <input id="siteName" type="text" placeholder="例：墨田区亀沢４丁目">
    <div class="project-title" style="margin-top:16px">調査区（任意）</div>
    <input id="sectionName" type="text" placeholder="例：調査区１　※空欄の場合は「未区分」">
    <div class="project-title" style="margin-top:16px">遺構</div>
    <input id="projectTitle" type="text" placeholder="例：1号住居、002号土坑、1号溝">
  </div>

<div class="v13-top-status">
  <div class="v13-top-label">現在の現場 ／ 調査区 ／ 遺構</div>
  <div id="v13TopTitle" class="v13-top-title">調査区・壁面</div>
  <div class="v15-layers-label">作成済みの層</div>
  <div id="v15Layers" class="v15-layers">まだ作成されていません。</div>
</div>

  <div class="current">
    <div class="current-label">現在作成している層</div>
    <div id="currentName" class="current-name">調査区１西壁 ／ 第1層</div>
    <div id="sequence" class="sequence">第1層から順番に作成できます。</div>
    <div class="next-actions">
      <button id="saveFinish" class="btn secondary" type="button">この層を保存して終了</button>
      <button id="finishWithoutSave" class="btn" type="button">保存せずに終了</button>
      <button id="saveNext" class="btn primary" type="button">この層を保存して「次の層」へ →</button>
      <button id="nextOnly" class="btn" type="button">保存せず「次の層」へ →</button>
    </div>

  <div class="tabs" id="tabs"></div>

    </div>

  </div>

    <div class="hint">現場名 → 調査区 → 遺構 → 各層の順に開きます。調査区が未入力のデータは「未区分」に入ります。</div>
    <input id="savedSearch" class="saved-search" type="search" placeholder="現場名・調査区・遺構名を検索" oninput="renderSaved()">
    <select id="savedSort" class="saved-search" style="margin-top:0" onchange="renderSaved()"><option value="recent">最近更新した順</option><option value="title">名前順</option></select>

<script>

function showScreen(name){
 const create=name==="create";
 document.getElementById("createScreen").classList.toggle("active",create);
 document.getElementById("savedScreen").classList.toggle("active",!create);
 document.getElementById("navCreate").classList.toggle("active",create);
 document.getElementById("navSaved").classList.toggle("active",!create);
 if(!create) renderSaved();
 const mb=document.getElementById("mobileBottomBar");if(mb)mb.style.display=create?"":"none";
 window.scrollTo({top:0,behavior:"smooth"});
}

const STORAGE_KEY="soilLayerHistories";
const DRAFT_KEY="soilLayerDraft_v32";
const CUSTOM_ITEMS_KEY="soilLayerCustomItems_v1";
let customSoils=[],customMixTypes=[];
function loadCustomItems(){
 try{
  const x=JSON.parse(localStorage.getItem(CUSTOM_ITEMS_KEY)||"{}");
  customSoils=Array.isArray(x.soils)?x.soils:[];
  customMixTypes=Array.isArray(x.mixes)?x.mixes:[];
 }catch(e){customSoils=[];customMixTypes=[]}
}
function saveCustomItems(){localStorage.setItem(CUSTOM_ITEMS_KEY,JSON.stringify({soils:customSoils,mixes:customMixTypes}))}
function addCustomSoil(){
 const el=document.getElementById("customSoilInput"),v=(el?.value||"").trim().replace(/層$/,"");
 if(!v)return;
 if(!soils.includes(v)&&!customSoils.includes(v)){customSoils.push(v);saveCustomItems()}
 state.soil=v;renderPanel();updateOutput();saveDraft();
}
function deleteCustomSoil(i){
 const v=customSoils[i];if(v==null)return;
 if(!confirm("任意項目「"+v+"」を候補から削除しますか？"))return;
 customSoils.splice(i,1);saveCustomItems();
 if(state.soil===v)state.soil=null;
 renderPanel();updateOutput();saveDraft();
}
function addCustomMixType(){
 const el=document.getElementById("customMixInput"),v=(el?.value||"").trim();
 if(!v)return;
 if(!mixTypes.includes(v)&&!customMixTypes.includes(v)){customMixTypes.push(v);saveCustomItems()}
 renderPanel();saveDraft();
}
function deleteCustomMixType(i){
 const v=customMixTypes[i];if(v==null)return;
 if(!confirm("任意項目「"+v+"」を候補から削除しますか？"))return;
 customMixTypes.splice(i,1);saveCustomItems();renderPanel();saveDraft();

function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function title(){return document.getElementById("projectTitle").value.trim()||"無題の遺構"}

function loadHistory(){try{history=JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}")}catch(e){history={}}}

function saveDraft(){
 try{
  const draft={siteName:document.getElementById("siteName").value,sectionName:document.getElementById("sectionName").value,projectTitle:document.getElementById("projectTitle").value,state:JSON.parse(JSON.stringify(state)),selectedHue,updatedAt:new Date().toISOString()};
  localStorage.setItem(DRAFT_KEY,JSON.stringify(draft));
 }catch(e){}
}
function restoreDraft(){
 try{
  const d=JSON.parse(localStorage.getItem(DRAFT_KEY)||"null");
  if(!d||!d.state)return false;
  state=d.state;
  if(d.siteName)document.getElementById("siteName").value=d.siteName;
  if(d.sectionName)document.getElementById("sectionName").value=d.sectionName;
  if(d.projectTitle)document.getElementById("projectTitle").value=d.projectTitle;
  if(d.selectedHue)selectedHue=d.selectedHue;
  return true;
 }catch(e){return false}
}
function key(siteName,sec,t,l){return siteName+"|"+sec+"|"+t+"|"+l}

function exportBackup(){
 const payload={format:"soil-layer-app-backup",version:2,exportedAt:new Date().toISOString(),history:history};
 const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
 const a=document.createElement("a");
 a.href=URL.createObjectURL(blob);
 const d=new Date();
 const stamp=d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");
 a.download="土層記載アプリ_全データ_"+stamp+".json";
 document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(a.href);
}
function importBackup(ev){
 const input=ev.target, file=input.files&&input.files[0];
 if(!file)return;
 const reader=new FileReader();
 reader.onload=function(){
  try{
   const obj=JSON.parse(reader.result);
   if(!obj||obj.format!=="soil-layer-app-backup"||!obj.history||typeof obj.history!=="object")throw new Error("invalid");
   const count=Object.keys(obj.history).length;
   if(!confirm("バックアップから "+count+" 件の層データを復元します。現在の保存データは置き換えられます。続けますか？")){input.value="";return;}
   history=obj.history;normalizeHistory();selectedSavedProject="";selectedSavedSection="";selectedSavedSite="";saveHistory();renderSaved();updateCurrent();
   document.getElementById("projectDetail").style.display="none";document.getElementById("sectionDetail").style.display="none";document.getElementById("siteDetail").style.display="none";document.getElementById("siteList").style.display="";
   alert("バックアップを復元しました。");
  }catch(e){alert("このファイルは土層記載アプリのバックアップとして読み込めません。");}
  input.value="";
 };
 reader.readAsText(file);
}

  requestAnimationFrame(()=>{const h=document.querySelector(".hue-filter");if(h){h.scrollLeft=hueScrollLeft;h.addEventListener("scroll",()=>{hueScrollLeft=h.scrollLeft},{passive:true})}});

function rememberHueScroll(){const el=document.querySelector(".hue-filter");if(el)hueScrollLeft=el.scrollLeft}
function chooseHue(h){rememberHueScroll();selectedHue=h;renderPanel();saveDraft()}
function chooseColor(i){
 rememberHueScroll();
 const next=colors[i];
 if(state.color&&state.color[0]===next[0]) state.color=null;
 else state.color=next;
 renderPanel();updateOutput();
}
function clearColor(){rememberHueScroll();state.color=null;renderPanel();updateOutput()}
function chooseSoil(v){state.soil=v;renderPanel();updateOutput()}
function chooseViscosity(v){state.viscosity=v;renderPanel();updateOutput()}
function chooseFirmness(v){state.firmness=v;renderPanel();updateOutput()}
function addMix(){state.mixes.push({type:mixTypes[0],size:"",amount:amounts[0]});renderPanel()}
function removeMix(i){state.mixes.splice(i,1);renderPanel();updateOutput()}

function generate(){
 let s=`第${state.layer}層`;
 const soilLabel={"土":"土層","礫":"礫層","砂":"砂層","シルト":"シルト層","粘土":"粘土層"};
 const subjectLabel=v=>soilLabel[v]||(v?String(v).replace(/層$/,"")+"層":"土層");
 if(state.color){
  const suffix=state.soil ? subjectLabel(state.soil) : "土層";
  const colorName=String(state.color[1]||"");
  const colorLabel=colorName.endsWith("色")?colorName:colorName+"色";
  s+=` ${state.color[0]} ${colorLabel}${suffix}`;
 }else if(state.soil){
  s+=` ${subjectLabel(state.soil)}`;
 }else s+=" 土層";
 if(state.viscosity||state.firmness){
  if(state.viscosity&&state.firmness&&state.viscosity===state.firmness){
   s+=` 粘性・しまりは${state.viscosity}。`;
  }else{
   if(state.viscosity){
    const viscosityText={"強い":"強く","やや強い":"やや強く","中位":"中位で","やや弱い":"やや弱く","弱い":"弱く"};
    s+=` 粘性は${viscosityText[state.viscosity]||state.viscosity}`;
   }
   if(state.firmness)s+=`${state.viscosity?"、":" "}しまりは${state.firmness}`;
   s+="。";
  }
 }else if(state.soil||state.color)s+="。";
 if(state.mixes.length){
  const grouped=[];
  state.mixes.forEach(m=>{
   const amount=m.amount||"";
   let g=grouped.find(x=>x.amount===amount);
   if(!g){g={amount,items:[]};grouped.push(g)}
   let label=m.type;
   if(String(m.size||"").trim())label+=`（${String(m.size).trim()}mm）`;
   g.items.push(label);
  });
  s+=" "+grouped.map(g=>g.items.join("・")+`を${g.amount}含む`).join("、")+"。";
 }
 if(state.note.trim())s+=" "+state.note.trim();
 document.getElementById("output").textContent=s;
 return s;
}
function updateOutput(){generate();saveDraft()}
function updateCurrent(){
 const currentText=site()+" ／ "+section()+" ／ "+title()+" ／ 第"+state.layer+"層";
 document.getElementById("currentName").textContent=currentText;
 const mc=document.getElementById("mobileCurrent");if(mc)mc.textContent=currentText;
 const saved=Object.values(history).filter(x=>x.siteName===site()&&x.sectionName===section()&&x.projectTitle===title()).sort((a,b)=>Number(a.layer)-Number(b.layer));
 document.getElementById("sequence").textContent=saved.length
  ?"作成済み："+saved.map(x=>"第"+x.layer+"層").join("、")+"　｜　現在：第"+state.layer+"層"
  :"現在：第"+state.layer+"層　｜　次は第"+(state.layer+1)+"層です";
 updateTopStatus();
 updateAccumulated();
}
function resetLayer(n){
 state={layer:n,color:null,soil:null,mixes:[],viscosity:null,firmness:null,note:""};
 active=0;renderTabs();renderPanel();document.getElementById("output").textContent="まだ文章は生成されていません。";updateCurrent();saveDraft();
}
function saveLayer(){
 const text=generate();
 const t=title();
 const sn=site();
 const sec=section();
 history[key(sn,sec,t,state.layer)]={siteName:sn,sectionName:sec,projectTitle:t,layer:String(state.layer),text,data:JSON.parse(JSON.stringify(state)),savedAt:new Date().toLocaleString("ja-JP")};
 saveHistory();selectedSavedSite=sn;selectedSavedProject=t;renderSaved();updateCurrent();
}
function findSavedLayer(layerNo,sn=site(),sec=section(),t=title()){
 return history[key(sn,sec,t,layerNo)]||null;
}
function openNextLayerOrInherit(nextLayer){
 const existing=findSavedLayer(nextLayer);
 if(existing){
  state=JSON.parse(JSON.stringify(existing.data));
  state.layer=Number(existing.layer)||nextLayer;
  active=0;
  renderTabs();renderPanel();generate();updateCurrent();saveDraft();
  window.scrollTo({top:0,behavior:"smooth"});
  return;
 }
 showInheritDialog(nextLayer);
}
function saveAndFinish(){
 if(!document.getElementById("output").textContent || document.getElementById("output").textContent==="まだ文章は生成されていません。")generate();
 saveLayer();
 showScreen("saved");
}
function finishWithoutSave(){
 if(!confirm("現在入力中の変更を保存せずに終了しますか？"))return;
 localStorage.removeItem(DRAFT_KEY);
 resetLayer(1);
 showScreen("saved");
}
function saveAndNext(){
 if(!document.getElementById("output").textContent || document.getElementById("output").textContent==="まだ文章は生成されていません。")generate();
 saveLayer();
 openNextLayerOrInherit(state.layer+1);
}
function nextOnly(){openNextLayerOrInherit(state.layer+1)}

function showInheritDialog(nextLayer){
 const old=JSON.parse(JSON.stringify(state));const labels=[["color","色調"],["soil","主体土"],["mixes","混入物"],["viscosity","粘性"],["firmness","締り"],["note","備考"]];
 const wrap=document.createElement("div");wrap.className="modal-backdrop";wrap.innerHTML=`<div class="modal-card"><h2>次の層へ引き継ぐ項目</h2><p class="hint">必要な項目だけ選択してください。何も選ばなければ新規入力になります。</p><div class="inherit-grid">${labels.map(([k,l])=>`<label class="inherit-item"><input type="checkbox" value="${k}"><span>${l}</span></label>`).join("")}</div><div class="actions"><button class="btn" id="inheritNone">引き継がず次へ</button><button class="btn primary" id="inheritGo">選択して次へ</button></div></div>`;document.body.appendChild(wrap);
 const go=use=>{const ns={layer:nextLayer,color:null,soil:null,mixes:[],viscosity:null,firmness:null,note:""};if(use)wrap.querySelectorAll("input:checked").forEach(c=>ns[c.value]=JSON.parse(JSON.stringify(old[c.value])));state=ns;active=0;wrap.remove();renderTabs();renderPanel();generate();updateCurrent();saveDraft()};
 wrap.querySelector("#inheritNone").onclick=()=>go(false);wrap.querySelector("#inheritGo").onclick=()=>go(true);
}

function loadLayer(x){
 document.getElementById("siteName").value=x.siteName||"未分類の現場";document.getElementById("sectionName").value=(x.sectionName&&x.sectionName!=="未区分")?x.sectionName:"";document.getElementById("projectTitle").value=x.projectTitle||"";
 state=JSON.parse(JSON.stringify(x.data));
 active=0;renderTabs();renderPanel();generate();updateCurrent();showScreen("create");
}
function deleteLayer(sn,sec,t,l){
 if(!confirm("第"+l+"層を削除しますか？"))return;
 delete history[key(sn,sec,t,l)];saveHistory();
 const remain=projectEntries(t,sn,sec);
 if(remain.length){
  renderSaved();
 }else{
  selectedSavedProject="";
  hideSavedDetails();document.getElementById("sectionDetail").style.display="block";
  renderSaved();
 }
 updateCurrent();
}
function deleteByFilter(test){
 Object.keys(history).forEach(k=>{if(test(history[k]))delete history[k]});
 saveHistory();
}
function deleteSite(sn){
 if(!confirm("現場「"+sn+"」と、その中のすべてのデータを削除しますか？"))return;
 deleteByFilter(x=>x.siteName===sn);
 selectedSavedSite=selectedSavedSection=selectedSavedProject="";
 hideSavedDetails();document.getElementById("siteList").style.display="";
 renderSaved();updateCurrent();
}
function deleteSection(sn,sec){
 if(!confirm("調査区「"+sec+"」と、その中のすべての遺構・層を削除しますか？"))return;
 deleteByFilter(x=>x.siteName===sn&&x.sectionName===sec);
 selectedSavedSection=selectedSavedProject="";
 hideSavedDetails();document.getElementById("siteDetail").style.display="block";
 renderSaved();updateCurrent();
}
function deleteProject(sn,sec,t){
 if(!confirm("遺構「"+t+"」と、その中のすべての層を削除しますか？"))return;
 deleteByFilter(x=>x.siteName===sn&&x.sectionName===sec&&x.projectTitle===t);
 selectedSavedProject="";
 hideSavedDetails();document.getElementById("sectionDetail").style.display="block";
 renderSaved();updateCurrent();
}

function normalizeHistory(){
 const out={};Object.values(history||{}).forEach(x=>{x.siteName=x.siteName||"未分類の現場";x.sectionName=x.sectionName||"未区分";x.projectTitle=x.projectTitle||"無題の遺構";out[key(x.siteName,x.sectionName,x.projectTitle,x.layer)]=x});history=out;
}
function entryTime(x){const d=Date.parse(x.savedAt||"");return Number.isFinite(d)?d:0}
function siteEntries(sn){return Object.values(history).filter(x=>x.siteName===sn)}
function sectionEntries(sec,sn=selectedSavedSite){return Object.values(history).filter(x=>x.siteName===sn&&x.sectionName===sec)}
function projectEntries(t,sn=selectedSavedSite||site(),sec=selectedSavedSection||section()){return Object.values(history).filter(x=>x.siteName===sn&&x.sectionName===sec&&x.projectTitle===t).sort((a,b)=>Number(a.layer)-Number(b.layer))}

const savedColorVisible=new Set();
function savedLayerUiKey(x){return key(x.siteName,x.sectionName,x.projectTitle,x.layer)}
function toggleSavedColor(k){
 if(savedColorVisible.has(k))savedColorVisible.delete(k);else savedColorVisible.add(k);
 const row=document.querySelector(`[data-color-key="${CSS.escape(k)}"]`);
 const btn=document.querySelector(`[data-color-btn="${CSS.escape(k)}"]`);
 const visible=savedColorVisible.has(k);
 if(row)row.classList.toggle("visible",visible);
 if(btn)btn.textContent=visible?"色を非表示":"色を表示";
}
function setAllSavedColors(show){
 const entries=projectEntries(selectedSavedProject,selectedSavedSite,selectedSavedSection).filter(x=>x.data&&x.data.color);
 entries.forEach(x=>{const k=savedLayerUiKey(x);if(show)savedColorVisible.add(k);else savedColorVisible.delete(k)});
 renderSaved();
}
function savedColorHtml(x){
 const c=x.data&&x.data.color;if(!c)return "";
 const k=savedLayerUiKey(x),visible=savedColorVisible.has(k);
 return `<button type="button" class="btn" data-color-btn="${esc(k)}" onclick='event.stopPropagation();toggleSavedColor(${JSON.stringify(k)})'>${visible?"色を非表示":"色を表示"}</button><div class="saved-color-row ${visible?"visible":""}" data-color-key="${esc(k)}"><div class="saved-color-swatch" style="background:${esc(c[2]||"#ccc")}"></div><div class="saved-color-meta"><b>${esc(c[0]||"")}</b> ${esc((String(c[1]||"").endsWith("色")?c[1]:String(c[1]||"")+"色"))}</div></div>`;
}

function renderSaved(){
 const q=(document.getElementById("savedSearch")?.value||"").trim().toLowerCase(),sortMode=document.getElementById("savedSort")?.value||"recent";
 const all=Object.values(history),sites={};all.forEach(x=>{(sites[x.siteName]??=[]).push(x)});
 let names=Object.keys(sites).filter(sn=>!q||sn.toLowerCase().includes(q)||sites[sn].some(x=>(x.sectionName+" "+x.projectTitle).toLowerCase().includes(q)));
 names.sort((a,b)=>sortMode==="title"?a.localeCompare(b,"ja"):Math.max(...sites[b].map(entryTime))-Math.max(...sites[a].map(entryTime)));
 document.getElementById("siteList").innerHTML=names.length?names.map(sn=>`<button class="site-chip" onclick='selectSavedSite(${JSON.stringify(sn)})'>${esc(sn)}</button>`).join(""):'<div class="hint">まだ保存されたデータはありません。</div>';
 if(!selectedSavedSite||!sites[selectedSavedSite])return;
 document.getElementById("savedSiteHeading").textContent=selectedSavedSite;document.getElementById("savedSiteBreadcrumb").textContent="現場："+selectedSavedSite;
 const secs={};sites[selectedSavedSite].forEach(x=>{(secs[x.sectionName]??=[]).push(x)});let secNames=Object.keys(secs).filter(v=>!q||v.toLowerCase().includes(q)||secs[v].some(x=>x.projectTitle.toLowerCase().includes(q)));secNames.sort((a,b)=>a.localeCompare(b,"ja"));
 document.getElementById("sectionList").innerHTML=secNames.map(v=>`<button class="site-chip" onclick='selectSavedSection(${JSON.stringify(v)})'>${esc(v)}（${new Set(secs[v].map(x=>x.projectTitle)).size}件）</button>`).join("");
 if(!selectedSavedSection||!secs[selectedSavedSection])return;
 document.getElementById("savedSectionHeading").textContent=selectedSavedSection;document.getElementById("savedSectionBreadcrumb").textContent="現場："+selectedSavedSite+"　›　調査区："+selectedSavedSection;
 const ps={};secs[selectedSavedSection].forEach(x=>{(ps[x.projectTitle]??=[]).push(x)});let pts=Object.keys(ps).sort((a,b)=>a.localeCompare(b,"ja"));
 document.getElementById("projectList").innerHTML=pts.map(t=>`<button class="project-chip" onclick='selectSavedProject(${JSON.stringify(t)})'>${esc(t)}（${ps[t].length}層）</button>`).join("");
 if(!selectedSavedProject||!ps[selectedSavedProject])return;
 const entries=ps[selectedSavedProject].sort((a,b)=>Number(a.layer)-Number(b.layer));document.getElementById("savedProjectHeading").textContent=selectedSavedProject;document.getElementById("savedProjectBreadcrumb").textContent="現場："+selectedSavedSite+"　›　調査区："+selectedSavedSection+"　›　遺構："+selectedSavedProject;
 document.getElementById("savedProjects").innerHTML=entries.map(x=>`<div class="saved-layer"><div class="saved-summary" onclick="toggleSavedLayer(this)"><div class="saved-summary-text"><div class="layer-text">${esc(x.text)}</div><div class="saved-date">${esc(x.savedAt||"")}</div></div><div class="saved-chevron">›</div></div><div class="saved-detail">${savedColorHtml(x)}<div class="saved-actions"><button class="btn primary" onclick='loadLayer(${JSON.stringify(x).replace(/'/g,"&#39;")})'>この層を編集</button><button class="btn" onclick='deleteLayer(${JSON.stringify(selectedSavedSite)},${JSON.stringify(selectedSavedSection)},${JSON.stringify(selectedSavedProject)},${JSON.stringify(x.layer)})'>削除</button></div></div></div>`).join("")+`<div class="saved-tools"><button class="btn" onclick='downloadTxtForProject(${JSON.stringify(selectedSavedProject)},${JSON.stringify(selectedSavedSite)},${JSON.stringify(selectedSavedSection)})'>TXT保存</button><button class="btn" onclick='printPdfForProject(${JSON.stringify(selectedSavedProject)},${JSON.stringify(selectedSavedSite)},${JSON.stringify(selectedSavedSection)})'>PDF保存</button></div>`;
}
function hideSavedDetails(){["siteDetail","sectionDetail","projectDetail"].forEach(id=>document.getElementById(id).style.display="none")}
function selectSavedSite(sn){selectedSavedSite=sn;selectedSavedSection="";selectedSavedProject="";document.getElementById("siteList").style.display="none";hideSavedDetails();document.getElementById("siteDetail").style.display="block";renderSaved()}
function backToSiteList(){selectedSavedSite=selectedSavedSection=selectedSavedProject="";hideSavedDetails();document.getElementById("siteList").style.display="";renderSaved()}
function selectSavedSection(sec){selectedSavedSection=sec;selectedSavedProject="";hideSavedDetails();document.getElementById("sectionDetail").style.display="block";renderSaved()}
function backToSectionList(){selectedSavedSection=selectedSavedProject="";hideSavedDetails();document.getElementById("siteDetail").style.display="block";renderSaved()}
function selectSavedProject(t){selectedSavedProject=t;hideSavedDetails();document.getElementById("projectDetail").style.display="block";renderSaved()}
function backToProjectList(){selectedSavedProject="";hideSavedDetails();document.getElementById("sectionDetail").style.display="block";renderSaved()}
function toggleSavedLayer(el){el.parentElement.classList.toggle("open")}
function buildText(t,entries){return "【"+t+"】\n"+entries.map(x=>"第"+x.layer+"層 "+x.text.replace(/^第\d+層\s*/,"")).join("\n")+"\n"}
function downloadText(name,text){const blob=new Blob([text],{type:"text/plain;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name.replace(/[\\/:*?"<>|]/g,"_")+".txt";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function downloadTxtForProject(t,sn=selectedSavedSite,sec=selectedSavedSection){const e=projectEntries(t,sn,sec);if(e.length)downloadText(sn+"_"+sec+"_"+t,sn+"\n"+sec+"\n\n"+buildText(t,e))}
function downloadTxtForSite(sn){const e=siteEntries(sn);if(!e.length)return;const secs=[...new Set(e.map(x=>x.sectionName))];let text=sn+"\n\n";secs.forEach(sec=>{text+="【"+sec+"】\n";const walls=[...new Set(sectionEntries(sec,sn).map(x=>x.projectTitle))];walls.forEach(t=>{text+=buildText(t,projectEntries(t,sn,sec))+"\n"})});downloadText(sn,text)}
function printHtml(titleText,body){
 const frame=document.createElement("iframe");
 frame.setAttribute("aria-hidden","true");
 frame.style.position="fixed";frame.style.right="0";frame.style.bottom="0";
 frame.style.width="0";frame.style.height="0";frame.style.border="0";
 document.body.appendChild(frame);
 const d=frame.contentDocument||frame.contentWindow.document;
 d.open();
 d.write(`<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>${esc(titleText)}</title><style>body{font-family:sans-serif;margin:25mm;line-height:1.8}h1{font-size:24px}h2{margin-top:24px}h3{margin-top:18px}p{border-bottom:1px solid #ddd;padding:7px 0}</style></head><body><h1>${esc(titleText)}</h1>${body}</body></html>`);
 d.close();
 const cleanup=()=>setTimeout(()=>{if(frame.parentNode)frame.remove()},500);
 frame.contentWindow.addEventListener("afterprint",cleanup,{once:true});
 setTimeout(()=>{frame.contentWindow.focus();frame.contentWindow.print();setTimeout(cleanup,30000)},300);
}
function printPdfForProject(t,sn=selectedSavedSite,sec=selectedSavedSection){const e=projectEntries(t,sn,sec);if(e.length)printHtml(sn+" / "+sec+" / "+t,`<h2>${esc(sec)}</h2><h3>${esc(t)}</h3>`+e.map(x=>`<p>${esc(x.text)}</p>`).join(""))}
function printPdfForSite(sn){const e=siteEntries(sn);if(!e.length)return;const secs=[...new Set(e.map(x=>x.sectionName))];let body="";secs.forEach(sec=>{body+=`<h2>${esc(sec)}</h2>`;[...new Set(sectionEntries(sec,sn).map(x=>x.projectTitle))].forEach(t=>{body+=`<h3>${esc(t)}</h3>`+projectEntries(t,sn,sec).map(x=>`<p>${esc(x.text)}</p>`).join("")})});printHtml(sn,body)}

document.getElementById("sectionName").addEventListener("input",function(){updateCurrent();updateTopStatus();updateAccumulated();saveDraft();});
document.getElementById("siteName").addEventListener("input",function(){updateCurrent();updateTopStatus();updateAccumulated();saveDraft();});
let lastProjectInput=document.getElementById("projectTitle").value.trim();
document.getElementById("projectTitle").addEventListener("input",function(){
 const now=this.value.trim();
 if(now!==lastProjectInput){
  const exists=Object.values(history).some(x=>x.siteName===site()&&x.sectionName===section()&&x.projectTitle===now);
  if(now&&!exists&&Number(state.layer)!==1)resetLayer(1);
  lastProjectInput=now;
 }
 updateCurrent();updateTopStatus();updateAccumulated();saveDraft();
});
document.getElementById("clearBtn").onclick=()=>resetLayer(state.layer);
document.getElementById("saveFinish").onclick=saveAndFinish;
document.getElementById("finishWithoutSave").onclick=finishWithoutSave;
document.getElementById("saveNext").onclick=saveAndNext;
document.getElementById("nextOnly").onclick=nextOnly;

loadCustomItems();
loadHistory();normalizeHistory();saveHistory();
const draftRestored=restoreDraft();
renderTabs();renderPanel();if(draftRestored)generate();updateCurrent();renderSaved();updateTopStatus();updateAccumulated();


// v15: 最上段に調査区名と、作成済みの層位を順番に表示
function updateAccumulated(){
  var box=document.getElementById("v15Layers");
  if(!box) return;
  var entries=projectEntries(title(),site(),section()).sort(function(a,b){return Number(a.layer)-Number(b.layer);});
  if(!entries.length){box.textContent="まだ作成されていません。";return;}
  box.innerHTML=entries.map(function(x){
    var text=x.text||"";
    return '<div class="v15-layer-item"><div class="v15-layer-text">'+esc(text)+'</div></div>';
  }).join('');
}

// v13: 最上段の調査区タイトル・層位表示
function updateTopStatus(){
  var titleEl=document.getElementById("projectTitle");
  var title=titleEl ? titleEl.value.trim() : "";
  if(!title) title="調査区・壁面";
  var siteEl=document.getElementById("siteName"); var sn=siteEl?siteEl.value.trim():""; if(!sn)sn="現場名";
  var layer=(typeof state!=="undefined" && state && state.layer) ? state.layer : 1;
  var t=document.getElementById("v13TopTitle");
  var l=document.getElementById("v13TopLayer");
  var secEl=document.getElementById("sectionName"); var sec=secEl?secEl.value.trim():""; if(!sec)sec="未区分";
  if(t) t.textContent=sn+" ／ "+sec+" ／ "+title;
  if(l) l.textContent="第"+layer+"層";
}

if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
