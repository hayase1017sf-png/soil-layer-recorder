<div class="app">
  <div class="screen-nav"><button id="navCreate" class="btn active" type="button" onclick="showScreen('create')">土層記載を作成</button><button id="navSaved" class="btn" type="button" onclick="showScreen('saved')">保存データ</button></div>
  <div id="createScreen" class="app-screen active">
  <div id="mobileCurrent" class="mobile-current">現在の入力</div>

  <div class="card">
    <div class="project-title">現場名</div>
    <input id="siteName" type="text" placeholder="例：墨田区亀沢４丁目">

    <input id="sectionName" type="text" placeholder="例：調査区１　※空欄の場合は「未区分」">
    <div class="project-title" style="margin-top:16px">検出面（任意）</div>
    <input id="surfaceName" type="text" placeholder="例：1面、第2検出面　※空欄の場合は「未区分」">
    <div class="project-title" style="margin-top:16px">遺構</div>
    <input id="projectTitle" type="text" placeholder="例：1号住居、002号土坑、1号溝">
  </div>

<div class="v13-top-status">
  <div class="v13-top-label">現在の現場 ／ 調査区 ／ 検出面 ／ 遺構</div>
  <div id="v13TopTitle" class="v13-top-title">調査区・壁面</div>

</div>

  <div class="current">
    <div class="current-label">現在作成している層</div>

    <div id="sequence" class="sequence">第1層から順番に作成できます。</div>
    <div class="next-actions">
      <button id="saveFinish" class="btn secondary" type="button">この層を保存して終了</button>
      <button id="finishWithoutSave" class="btn" type="button">保存せずに終了</button>

      <button id="nextOnly" class="btn" type="button">保存せず「次の層」へ →</button>
    </div>
  </div>

  <div class="tabs" id="tabs"></div>
  <div class="panel" id="panel"></div>

    <div class="actions">
      <button class="btn" id="clearBtn" type="button">現在の層をクリア</button>
    </div>
  </div>

  </div>

  <div id="savedScreen" class="app-screen">

    <input id="savedSearch" class="saved-search" type="search" placeholder="現場名・調査区・検出面・遺構名を検索" oninput="renderSaved()">

const BACKUP_FORMAT_VERSION=4;
function safeLocalSet(k,v,label){try{localStorage.setItem(k,v);return true}catch(e){alert((label||"データ")+"を端末に保存できませんでした。保存容量不足の可能性があります。\nJSONバックアップを作成してから不要なブラウザデータを整理してください。");return false}}
function currentCustomItems(){return {soils:[...customSoils],mixes:[...customMixTypes],viscosities:[...customViscosities],firmnesses:[...customFirmnesses]}}

function createAutoSnapshot(reason){
 try{
  const draft=JSON.parse(localStorage.getItem(DRAFT_KEY)||"null");
  const snap={createdAt:new Date().toISOString(),reason:reason||"変更前",history:JSON.parse(JSON.stringify(history||{})),customItems:currentCustomItems(),draft:draft};
  const list=getAutoSnapshots();
  const sig=JSON.stringify({history:snap.history,customItems:snap.customItems,draft:snap.draft});
  if(list.length){const prev=JSON.stringify({history:list[0].history,customItems:list[0].customItems,draft:list[0].draft});if(sig===prev)return false;}
  list.unshift(snap);setAutoSnapshots(list);return true;
 }catch(e){return false}
}
function applySnapshotData(snap){
 if(!snap||!snap.history||typeof snap.history!=="object")return false;
 history=JSON.parse(JSON.stringify(snap.history));normalizeHistory();
 if(snap.customItems&&typeof snap.customItems==="object"){
  safeLocalSet(CUSTOM_ITEMS_KEY,JSON.stringify(snap.customItems),"任意項目");loadCustomItems();
 }
 if(Object.prototype.hasOwnProperty.call(snap,"draft")){
  if(snap.draft)safeLocalSet(DRAFT_KEY,JSON.stringify(snap.draft),"下書き");else localStorage.removeItem(DRAFT_KEY);
 }
 saveHistory();selectedSavedProject="";selectedSavedSurface="";selectedSavedSection="";selectedSavedSite="";renderSaved();updateCurrent();

 return true;
}
function restoreLatestAutoSnapshot(){

 const snap=list[0],d=new Date(snap.createdAt),when=Number.isNaN(d.getTime())?snap.createdAt:d.toLocaleString("ja-JP");
 if(!confirm("直前の自動バックアップへ戻しますか？\n\n日時："+when+"\n内容："+(snap.reason||"変更前")+"\n\n現在の状態も復元前バックアップとして保存します。"))return;

function loadCustomItems(){
 try{

function saveCustomItems(){safeLocalSet(CUSTOM_ITEMS_KEY,JSON.stringify(currentCustomItems()),"任意項目")}
function addCustomSoil(){

}
function deleteCustomSoil(i){
 const v=customSoils[i];if(v==null)return;

 renderPanel();updateOutput();saveDraft();
}
function addCustomMixType(){

}

function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}

function saveDraft(){
 try{
  const draft={siteName:document.getElementById("siteName").value,sectionName:document.getElementById("sectionName").value,surfaceName:document.getElementById("surfaceName").value,projectTitle:document.getElementById("projectTitle").value,state:JSON.parse(JSON.stringify(state)),selectedHue,updatedAt:new Date().toISOString()};
  safeLocalSet(DRAFT_KEY,JSON.stringify(draft),"下書き");
 }catch(e){}
}
function restoreDraft(){
 try{
  const d=JSON.parse(localStorage.getItem(DRAFT_KEY)||"null");
  if(!d||!d.state)return false;
  state=d.state;
  if(d.siteName)document.getElementById("siteName").value=d.siteName;
  if(d.sectionName)document.getElementById("sectionName").value=d.sectionName;
  if(d.surfaceName)document.getElementById("surfaceName").value=d.surfaceName;
  if(d.projectTitle)document.getElementById("projectTitle").value=d.projectTitle;
  if(d.selectedHue)selectedHue=d.selectedHue;
  return true;
 }catch(e){return false}
}
function key(siteName,sec,surf,t,l){return siteName+"|"+sec+"|"+surf+"|"+t+"|"+l}

function exportBackup(){
 const draft=(()=>{try{return JSON.parse(localStorage.getItem(DRAFT_KEY)||"null")}catch(e){return null}})();
 const payload={format:"soil-layer-app-backup",version:BACKUP_FORMAT_VERSION,backupFormatVersion:BACKUP_FORMAT_VERSION,exportedAt:new Date().toISOString(),history:history,customItems:currentCustomItems(),draft:draft};
 const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
 const a=document.createElement("a");
 a.href=URL.createObjectURL(blob);
 const d=new Date();
 const stamp=d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");
 a.download="土層記載アプリ_完全バックアップ_"+stamp+".json";
 document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(a.href);
}
function importBackup(ev){
 const input=ev.target, file=input.files&&input.files[0];
 if(!file)return;
 const reader=new FileReader();
 reader.onload=function(){
  try{
   const obj=JSON.parse(reader.result);
   if(!obj||obj.format!=="soil-layer-app-backup"||!obj.history||typeof obj.history!=="object")throw new Error("invalid");
   const count=Object.keys(obj.history).length;
   const ver=Number(obj.backupFormatVersion||obj.version||0);
   const extra=ver>=4?"\n任意項目と下書きもバックアップ内容に含まれている場合は復元します。":"\n旧形式バックアップのため、層データのみ復元します。";
   if(!confirm("バックアップから "+count+" 件の層データを復元します。現在の保存データは置き換えられます。"+extra+"\n\n復元前の現在データは自動バックアップに保存します。続けますか？")){input.value="";return;}
   createAutoSnapshot("JSONバックアップ復元前");
   history=obj.history;normalizeHistory();
   if(ver>=4&&obj.customItems&&typeof obj.customItems==="object"){safeLocalSet(CUSTOM_ITEMS_KEY,JSON.stringify(obj.customItems),"任意項目");loadCustomItems();}
   if(ver>=4&&Object.prototype.hasOwnProperty.call(obj,"draft")){if(obj.draft)safeLocalSet(DRAFT_KEY,JSON.stringify(obj.draft),"下書き");else localStorage.removeItem(DRAFT_KEY);}
   selectedSavedProject="";selectedSavedSurface="";selectedSavedSection="";selectedSavedSite="";saveHistory();renderSaved();updateCurrent();
   document.getElementById("projectDetail").style.display="none";document.getElementById("surfaceDetail").style.display="none";document.getElementById("sectionDetail").style.display="none";document.getElementById("siteDetail").style.display="none";document.getElementById("siteList").style.display="";
   alert("バックアップを復元しました。");
  }catch(e){alert("このファイルは土層記載アプリのバックアップとして読み込めません。");}
  input.value="";
 };
 reader.readAsText(file);
}

function addCustomViscosity(){
 const el=document.getElementById("customViscosityInput"),v=(el?.value||"").trim();
 if(!v)return;
 if(!levels.includes(v)&&!customViscosities.includes(v)){customViscosities.push(v);saveCustomItems()}
 state.viscosity=v;renderPanel();updateOutput();saveDraft();
}
function deleteCustomViscosity(i){
 const v=customViscosities[i];if(v==null)return;
 if(!confirm("任意項目「"+v+"」を候補から削除しますか？"))return;
 customViscosities.splice(i,1);saveCustomItems();
 if(state.viscosity===v)state.viscosity=null;
 renderPanel();updateOutput();saveDraft();
}

function generate(){
 let s=`第${state.layer}層`;
 const soilLabel={"土":"土層","礫":"礫層","砂":"砂層","シルト":"シルト層","粘土":"粘土層"};
 const subjectLabel=v=>soilLabel[v]||(v?String(v).replace(/層$/,"")+"層":"土層");
 if(state.color){
  const suffix=state.soil ? subjectLabel(state.soil) : "土層";
  const colorName=String(state.color[1]||"");
  const colorLabel=colorName.endsWith("色")?colorName:colorName+"色";
  s+=` ${state.color[0]} ${colorLabel}${suffix}`;
 }else if(state.soil){
  s+=` ${subjectLabel(state.soil)}`;
 }else s+=" 土層";
 if(state.viscosity||state.firmness){
  if(state.viscosity&&state.firmness&&state.viscosity===state.firmness){
   s+=` 粘性・しまりは${state.viscosity}。`;
  }else{
   if(state.viscosity){
    const viscosityText={"強い":"強く","やや強い":"やや強く","中位":"中位で","やや弱い":"やや弱く","弱い":"弱く"};
    const rawViscosity=String(state.viscosity);
    const connectedViscosity=viscosityText[rawViscosity]||(rawViscosity.endsWith("い")?rawViscosity.slice(0,-1)+"く":rawViscosity);
    s+=` 粘性は${connectedViscosity}`;
   }
   if(state.firmness)s+=`${state.viscosity?"、":" "}しまりは${state.firmness}`;
   s+="。";
  }
 }else if(state.soil||state.color)s+="。";
 if(state.mixes.length){
  const grouped=[];
  state.mixes.forEach(m=>{
   const amount=m.amount||"";
   let g=grouped.find(x=>x.amount===amount);
   if(!g){g={amount,items:[]};grouped.push(g)}
   let label=m.type;
   if(String(m.size||"").trim())label+=`（${String(m.size).trim()}mm）`;
   g.items.push(label);
  });
  s+=" "+grouped.map(g=>g.items.join("・")+`を${g.amount}含む`).join("、")+"。";
 }
 if(state.note.trim())s+=" "+state.note.trim();
 document.getElementById("output").textContent=s;
 return s;
}

 if(!selectedSavedSite||!sites[selectedSavedSite])return;

 const secs={};sites[selectedSavedSite].forEach(x=>{(secs[x.sectionName]??=[]).push(x)});let secNames=Object.keys(secs).filter(v=>!q||v.toLowerCase().includes(q)||secs[v].some(x=>(x.surfaceName+" "+x.projectTitle).toLowerCase().includes(q)));secNames.sort((a,b)=>a.localeCompare(b,"ja"));
 document.getElementById("sectionList").innerHTML=secNames.map(v=>`<button class="site-chip" onclick='selectSavedSection(${JSON.stringify(v)})'>${esc(v)}</button>`).join("");

 const surfs={};secs[selectedSavedSection].forEach(x=>{(surfs[x.surfaceName]??=[]).push(x)});let surfNames=Object.keys(surfs).filter(v=>!q||v.toLowerCase().includes(q)||surfs[v].some(x=>x.projectTitle.toLowerCase().includes(q)));surfNames.sort((a,b)=>a.localeCompare(b,"ja"));
 document.getElementById("surfaceList").innerHTML=surfNames.map(v=>`<button class="project-chip" onclick='selectSavedSurface(${JSON.stringify(v)})'>${esc(v)}（${new Set(surfs[v].map(x=>x.projectTitle)).size}件）</button>`).join("");

function hideSavedDetails(){["siteDetail","sectionDetail","surfaceDetail","projectDetail"].forEach(id=>document.getElementById(id).style.display="none")}
function selectSavedSite(sn){selectedSavedSite=sn;selectedSavedSection=selectedSavedSurface=selectedSavedProject="";document.getElementById("siteList").style.display="none";hideSavedDetails();document.getElementById("siteDetail").style.display="block";renderSaved()}
function backToSiteList(){selectedSavedSite=selectedSavedSection=selectedSavedSurface=selectedSavedProject="";hideSavedDetails();document.getElementById("siteList").style.display="";renderSaved()}
function selectSavedSection(sec){selectedSavedSection=sec;selectedSavedSurface=selectedSavedProject="";hideSavedDetails();document.getElementById("sectionDetail").style.display="block";renderSaved()}
function backToSectionList(){selectedSavedSection=selectedSavedSurface=selectedSavedProject="";hideSavedDetails();document.getElementById("siteDetail").style.display="block";renderSaved()}
function selectSavedSurface(surf){selectedSavedSurface=surf;selectedSavedProject="";hideSavedDetails();document.getElementById("surfaceDetail").style.display="block";renderSaved()}
function backToSurfaceList(){selectedSavedSurface=selectedSavedProject="";hideSavedDetails();document.getElementById("sectionDetail").style.display="block";renderSaved()}
function selectSavedProject(t){selectedSavedProject=t;hideSavedDetails();document.getElementById("projectDetail").style.display="block";renderSaved()}
function backToProjectList(){selectedSavedProject="";hideSavedDetails();document.getElementById("surfaceDetail").style.display="block";renderSaved()}
function toggleSavedLayer(el){el.parentElement.classList.toggle("open")}
function buildText(t,entries){return "【"+t+"】\n"+entries.map(x=>"第"+x.layer+"層 "+x.text.replace(/^第\d+層\s*/,"")).join("\n")+"\n"}
function downloadText(name,text){const blob=new Blob([text],{type:"text/plain;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name.replace(/[\\/:*?"<>|]/g,"_")+".txt";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function downloadTxtForProject(t,sn=selectedSavedSite,sec=selectedSavedSection,surf=selectedSavedSurface){const e=projectEntries(t,sn,sec,surf);if(e.length)downloadText(sn+"_"+sec+"_"+surf+"_"+t,sn+"\n"+sec+"\n"+surf+"\n\n"+buildText(t,e))}
function downloadTxtForSection(sn,sec){const e=sectionEntries(sec,sn);if(!e.length)return;let text=sn+"\n【"+sec+"】\n\n";const surfs=[...new Set(e.map(x=>x.surfaceName))];surfs.forEach(surf=>{text+="［"+surf+"］\n";const projects=[...new Set(surfaceEntries(surf,sn,sec).map(x=>x.projectTitle))];projects.forEach(t=>{text+=buildText(t,projectEntries(t,sn,sec,surf))+"\n"})});downloadText(sn+"_"+sec,text)}
function downloadTxtForSite(sn){const e=siteEntries(sn);if(!e.length)return;const secs=[...new Set(e.map(x=>x.sectionName))];let text=sn+"\n\n";secs.forEach(sec=>{text+="【"+sec+"】\n";const surfs=[...new Set(sectionEntries(sec,sn).map(x=>x.surfaceName))];surfs.forEach(surf=>{text+="［"+surf+"］\n";[...new Set(surfaceEntries(surf,sn,sec).map(x=>x.projectTitle))].forEach(t=>{text+=buildText(t,projectEntries(t,sn,sec,surf))+"\n"})})});downloadText(sn,text)}
function printHtml(titleText,body){const frame=document.createElement("iframe");frame.setAttribute("aria-hidden","true");frame.style.position="fixed";frame.style.right="0";frame.style.bottom="0";frame.style.width="0";frame.style.height="0";frame.style.border="0";document.body.appendChild(frame);const d=frame.contentDocument||frame.contentWindow.document;d.open();d.write(`<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>${esc(titleText)}</title><style>body{font-family:sans-serif;margin:25mm;line-height:1.8}h1{font-size:24px}h2{margin-top:24px}h3{margin-top:18px}h4{margin-top:14px}p{border-bottom:1px solid #ddd;padding:7px 0}</style></head><body><h1>${esc(titleText)}</h1>${body}</body></html>`);d.close();const cleanup=()=>setTimeout(()=>{if(frame.parentNode)frame.remove()},500);frame.contentWindow.addEventListener("afterprint",cleanup,{once:true});setTimeout(()=>{frame.contentWindow.focus();frame.contentWindow.print();setTimeout(cleanup,30000)},300);}
function printPdfForProject(t,sn=selectedSavedSite,sec=selectedSavedSection,surf=selectedSavedSurface){const e=projectEntries(t,sn,sec,surf);if(e.length)printHtml(sn+" / "+sec+" / "+surf+" / "+t,`<h2>${esc(sec)}</h2><h3>${esc(surf)}</h3><h4>${esc(t)}</h4>`+e.map(x=>`<p>${esc(x.text)}</p>`).join(""))}
function printPdfForSection(sn,sec){const e=sectionEntries(sec,sn);if(!e.length)return;let body=`<h2>${esc(sec)}</h2>`;[...new Set(e.map(x=>x.surfaceName))].forEach(surf=>{body+=`<h3>${esc(surf)}</h3>`;[...new Set(surfaceEntries(surf,sn,sec).map(x=>x.projectTitle))].forEach(t=>{body+=`<h4>${esc(t)}</h4>`+projectEntries(t,sn,sec,surf).map(x=>`<p>${esc(x.text)}</p>`).join("")})});printHtml(sn+" / "+sec,body)}
function printPdfForSite(sn){const e=siteEntries(sn);if(!e.length)return;const secs=[...new Set(e.map(x=>x.sectionName))];let body="";secs.forEach(sec=>{body+=`<h2>${esc(sec)}</h2>`;[...new Set(sectionEntries(sec,sn).map(x=>x.surfaceName))].forEach(surf=>{body+=`<h3>${esc(surf)}</h3>`;[...new Set(surfaceEntries(surf,sn,sec).map(x=>x.projectTitle))].forEach(t=>{body+=`<h4>${esc(t)}</h4>`+projectEntries(t,sn,sec,surf).map(x=>`<p>${esc(x.text)}</p>`).join("")})})});printHtml(sn,body)}

// v61: スマホの「保存して次の層へ」は0.7秒長押しで実行
(function setupHoldSaveNext(){
 const btn=document.getElementById("mobileSaveNext");
 if(!btn)return;
 let timer=null,done=false;
 const cancel=()=>{if(timer){clearTimeout(timer);timer=null}btn.classList.remove("holding","hold-done")};
 const start=e=>{
  if(e.type==="pointerdown"&&e.button!==undefined&&e.button!==0)return;
  done=false;cancel();btn.classList.add("holding");
  timer=setTimeout(()=>{timer=null;done=true;btn.classList.remove("holding");btn.classList.add("hold-done");if(navigator.vibrate)navigator.vibrate(35);saveAndNext();setTimeout(()=>btn.classList.remove("hold-done"),180)},700);
 };
 btn.addEventListener("pointerdown",start);
 ["pointerup","pointercancel","pointerleave"].forEach(ev=>btn.addEventListener(ev,()=>{if(!done)cancel()}));
 btn.addEventListener("click",e=>{e.preventDefault();e.stopPropagation()});
 btn.addEventListener("contextmenu",e=>e.preventDefault());
})();

// v15: 最上段に調査区名と、作成済みの層位を順番に表示
function updateAccumulated(){
  var box=document.getElementById("v15Layers");
  if(!box) return;
  var entries=projectEntries(title(),site(),section(),surface()).sort(function(a,b){return Number(a.layer)-Number(b.layer);});
  if(!entries.length){box.textContent="まだ作成されていません。";return;}
  box.innerHTML=entries.map(function(x){
    var text=x.text||"";
    return '<div class="v15-layer-item"><div class="v15-layer-text">'+esc(text)+'</div></div>';
  }).join('');
}

// v13: 最上段の調査区タイトル・層位表示
function updateTopStatus(){
  var titleEl=document.getElementById("projectTitle");
  var title=titleEl ? titleEl.value.trim() : "";
  if(!title) title="調査区・壁面";
  var siteEl=document.getElementById("siteName"); var sn=siteEl?siteEl.value.trim():""; if(!sn)sn="現場名";
  var layer=(typeof state!=="undefined" && state && state.layer) ? state.layer : 1;
  var t=document.getElementById("v13TopTitle");
  var l=document.getElementById("v13TopLayer");
  var secEl=document.getElementById("sectionName"); var sec=secEl?secEl.value.trim():""; if(!sec)sec="未区分";
  var surfEl=document.getElementById("surfaceName"); var surf=surfEl?surfEl.value.trim():""; if(!surf)surf="未区分";
  if(t) t.textContent=sn+" ／ "+sec+" ／ "+surf+" ／ "+title;
  if(l) l.textContent="第"+layer+"層";
}
